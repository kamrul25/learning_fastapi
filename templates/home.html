{% extends "layout.html" %}

{% block content %}
    <h1>Home Page</h1>
    <p>Welcome to the blog!</p>

    <!-- Loop through dynamic posts passed from FastAPI -->
    {% for post in posts %}
        <article>
            <h2>{{ post.title }}</h2>
            <p><strong>Author:</strong> {{ post.author }} | <strong>Date:</strong> {{ post.date_posted }}</p>
            <p>{{ post.content }}</p>
        </article>
        <hr>
    {% endfor %}
{% endblock content %}
